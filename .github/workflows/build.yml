permissions:
    contents: write

on:
    push:
    pull_request:

jobs:
    ubuntu:
        strategy:
            matrix:
                xserver-version: [ master, xlibre-xserver-25.1.11, xlibre-xserver-25.0.0.26 ]
        runs-on: ubuntu-latest
        steps:
            - uses: X11Libre/action-build-driver/target/ubuntu@v0.4.1
              with:
                xserver-version: ${{ matrix.xserver-version }}

    freebsd:
        strategy:
            matrix:
                xserver-version: [ master, xlibre-xserver-25.1.11, xlibre-xserver-25.0.0.26 ]
        runs-on: ubuntu-latest
        steps:
            - uses: X11Libre/action-build-driver/target/freebsd@v0.4.1
              with:
                xserver-version: ${{ matrix.xserver-version }}

    dragonfly:
        strategy:
            matrix:
                # xlibre-xserver-25.0.x not compiling on dragonfly yet
                xserver-version: [ master, xlibre-xserver-25.1.11 ]
        runs-on: ubuntu-latest
        steps:
            - uses: X11Libre/action-build-driver/target/dragonfly@v0.4.1
              with:
                xserver-version: ${{ matrix.xserver-version }}

    netbsd:
        strategy:
            matrix:
                xserver-version: [ master, xlibre-xserver-25.1.11 ]
        runs-on: ubuntu-latest
        steps:
            - uses: X11Libre/action-build-driver/target/netbsd@v0.4.1
              with:
                xserver-version: ${{ matrix.xserver-version }}

    abi:
        runs-on: ubuntu-latest
        env:
            RELEASE_SERVERS: release/25.0 release/25.1 release/25.2
        steps:
            # Installs build dependencies and the prerequisites in ~/x11.
            - uses: X11Libre/action-build-driver/target/ubuntu@v0.4.1
              with:
                xserver-version: release/25.2

            - name: install libabigail
              run: sudo apt-get install -y abigail-tools

            - name: use the ~/x11 prerequisites
              run: |
                echo "ABI_WORK=$RUNNER_TEMP/abi" >> "$GITHUB_ENV"
                MACHINE=$(gcc -dumpmachine)
                echo "PKG_CONFIG_PATH=$HOME/x11/share/pkgconfig:$HOME/x11/lib/$MACHINE/pkgconfig:$HOME/x11/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

            - name: server symbols, release branches
              run: ABI_SERVERS="$RELEASE_SERVERS" test/abi/run.sh

            - name: server symbols, master (non-blocking)
              continue-on-error: true
              run: ABI_SERVERS=master test/abi/run.sh

            - name: ABI gate for this pull request, release branches
              if: ${{ github.event_name == 'pull_request' }}
              run: |
                git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
                BEFORE_REF=${{ github.event.pull_request.base.sha }} \
                ABI_SERVERS="$RELEASE_SERVERS" test/abi/gate-driver.sh

            - name: ABI gate for this pull request, master (non-blocking)
              if: ${{ github.event_name == 'pull_request' }}
              continue-on-error: true
              run: |
                BEFORE_REF=${{ github.event.pull_request.base.sha }} \
                ABI_SERVERS=master test/abi/gate-driver.sh

            - name: server-internal includes are needed
              run: |
                meson setup build-abi-ci
                meson test -C build-abi-ci private-includes --print-errorlogs

    release-notes:
        name:    Release pushed tag
        runs-on: ubuntu-latest
        if:      ${{ startsWith(github.ref, 'refs/tags/xlibre-') }}
        needs:   [ ubuntu, freebsd, dragonfly, netbsd, abi ]
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - uses: X11Libre/action-build-driver/release@v0.4.1
